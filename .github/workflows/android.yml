# Builds the Android app on GitHub's servers.
# Download the APK from the run's "Artifacts" section and drag it onto the emulator.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Run tests
        run: flutter test --file-reporter json:test-results.json

      # If a test fails, show its name and error in the run's Annotations box.
      - name: Show failing tests
        if: failure()
        shell: bash
        run: |
          [ -f test-results.json ] || exit 0
          jq -r 'select(.type=="testStart") | "\(.test.id)\t\(.test.name)"' test-results.json > names.tsv
          jq -r 'select(.type=="error") | "\(.testID)\t\(.error | gsub("[\r\n]+"; " "))"' test-results.json |
          while IFS=$'\t' read -r id err; do
            name=$(awk -F'\t' -v id="$id" '$1 == id { print $2 }' names.tsv)
            echo "::error title=Failed test: ${name}::${err:0:900}"
          done

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: tasks-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
