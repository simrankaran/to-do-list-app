# Builds the Android app on GitHub's servers.
# Download the APK from the run's "Artifacts" section and drag it onto the emulator.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Run tests
        run: flutter test --file-reporter json:test-results.json

      # If a test fails, show its name and error in the run's Annotations box.
      - name: Show failing tests
        if: failure()
        shell: bash
        run: |
          [ -f test-results.json ] || exit 0
          for id in $(jq -r 'select(.type=="error") | .testID' test-results.json | sort -u); do
            name=$(jq -r --argjson id "$id" 'select(.type=="testStart" and .test.id==$id) | .test.name' test-results.json)
            # Flutter prints the real exception as log lines before the error.
            details=$(jq -r --argjson id "$id" 'select(.type=="print" and .testID==$id) | .message' test-results.json \
              | grep -v '^[═╡╞ ]*$' | tr '\n' ' ' | tr -s ' ' | cut -c1-1800)
            if [ -z "$details" ]; then
              details=$(jq -r --argjson id "$id" 'select(.type=="error" and .testID==$id) | .error' test-results.json \
                | tr '\n' ' ' | tr -s ' ' | cut -c1-1800)
            fi
            details=${details//%/%25}
            echo "::error title=Failed test: ${name}::${details}"
          done

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: tasks-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
